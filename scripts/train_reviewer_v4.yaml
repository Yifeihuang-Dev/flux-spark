# Reviewer LoRA fine-tuning config — v4 (25% negatives, 500 steps)
#
# Factor-isolation cell: v1's negative ratio + v3's step count.
# Result: FPR down to 6.2%, recall 55.9% — confirms steps dominate.

model: /Volumes/LLM/hf/MiniCPM5-2B-SFT-MLX-4bit

data: /Volumes/LLM/datasets/reviewer_mlx
train: true
fine_tune_type: lora

num_layers: 16

iters: 500
batch_size: 4

max_seq_length: 1024

learning_rate: 1e-5

save_every: 50
adapter_path: /Volumes/LLM/adapters/reviewer-v4

steps_per_report: 10
steps_per_eval: 50
val_batches: 10

grad_checkpoint: true

mask_prompt: true

lora_parameters:
  rank: 16
  # Note: mlx-lm uses `scale`, not the `alpha` other frameworks use
  scale: 32.0
  dropout: 0.0

seed: 42
