# Reviewer LoRA fine-tuning config — v3 (40% negatives, 500 steps) — current best
#
# v1's negative ratio + more epochs. FPR 31.2% -> 18.8%, precision 77.6% -> 88.2%,
# recall 76.5% -> 66.2%. Confirms steps, not the negative ratio, are the dominant factor.

model: /Volumes/LLM/hf/MiniCPM5-2B-SFT-MLX-4bit

data: /Volumes/LLM/datasets/reviewer_mlx_v2
train: true
fine_tune_type: lora

num_layers: 16

# 500 steps ≈ 11 epochs, ~30 minutes
iters: 500
batch_size: 4

max_seq_length: 1024

learning_rate: 1e-5

save_every: 50
adapter_path: /Volumes/LLM/adapters/reviewer-v3

steps_per_report: 10
steps_per_eval: 50
val_batches: 10

grad_checkpoint: true

mask_prompt: true

lora_parameters:
  rank: 16
  # Note: mlx-lm uses `scale`, not the `alpha` other frameworks use
  scale: 32.0
  dropout: 0.0

seed: 42
