# Reviewer LoRA fine-tuning config
#
# Key differences from the executor round:
# 1. Base is the SFT build of MiniCPM5-2B (follows instructions), not the earlier base build
# 2. Samples are short (code + issue list, ~250 tokens), so training is much faster
# 3. Only 177 samples — rely on multiple epochs rather than volume

# Base model: SFT build, converted and 4-bit quantized to MLX
model: /Volumes/LLM/hf/MiniCPM5-2B-SFT-MLX-4bit

# Review task data (clean functions + automatically injected known bugs)
data: /Volumes/LLM/datasets/reviewer_mlx
train: true
fine_tune_type: lora

# Layers to train
num_layers: 16

# Training scale
# 177 samples / batch 4 ≈ 44 steps per epoch. Measured 3.66 s/step (short samples,
# far faster than the executor's 17-25 s); 300 steps ≈ 6.8 epochs, 18 minutes.
# With little data, go by epochs — but stay under 10 to avoid overfitting.
iters: 300
batch_size: 4

# Sequence length: review samples are short (code + issue list); 1024 is plenty
max_seq_length: 1024

learning_rate: 1e-5

# Save a checkpoint every 50 steps so a crash can resume
save_every: 50
adapter_path: /Volumes/LLM/adapters/reviewer-v1

steps_per_report: 10
steps_per_eval: 50
val_batches: 10

# Memory optimization
grad_checkpoint: true

# Compute loss on the answer only: the review instruction is fixed and the model
# should not be trained to memorize the prompt
mask_prompt: true

lora_parameters:
  rank: 16
  # Note: mlx-lm uses `scale`, not the `alpha` other frameworks use
  scale: 32.0
  dropout: 0.0

seed: 42
