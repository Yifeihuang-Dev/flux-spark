# MiniCPM5-2B executor LoRA fine-tuning config
# Step count is compressed for this machine (MLX GPU ~1.9 TFLOPS, 2B model at
# ~50-80 tokens/s); the goal is an overnight run (~8 hours) with a checkpoint
# written every 50 steps.

model: /Volumes/LLM/hf/openbmb__MiniCPM5-2B-MLX
data: /Volumes/LLM/datasets/magicoder_mlx
train: true

# Output
adapter_path: /Volumes/LLM/adapters/executor-v1
save_every: 50

# Training scale
# Measured 58 tok/s, ~17.6 s/step; 1,000 steps ≈ 5 hours.
# Even throttled to 40 tok/s by thermals it is ~7 hours — inside one night with margin.
iters: 1000
batch_size: 4
max_seq_length: 1024
num_layers: 16
learning_rate: 1.0e-5
grad_checkpoint: true

# Compute loss on the assistant answer only; don't train the model on the prompt
mask_prompt: true

# Logging and validation
steps_per_report: 10
steps_per_eval: 100
val_batches: 20

lora_parameters:
  rank: 16
  # Note: mlx-lm uses `scale`, not the `alpha` other frameworks use
  scale: 32.0
  dropout: 0.0

seed: 42
