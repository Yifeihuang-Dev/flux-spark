# Reviewer LoRA fine-tuning config — v2 (40% negatives)
#
# Changes from v1: negative ratio 25% -> 40% (data reviewer_mlx_v2).
# Hypothesis under test: more clean samples should push the false-positive rate down.
# Result: falsified — FPR stayed at 31.2% while recall dropped 13 pp.

model: /Volumes/LLM/hf/MiniCPM5-2B-SFT-MLX-4bit

data: /Volumes/LLM/datasets/reviewer_mlx_v2
train: true
fine_tune_type: lora

num_layers: 16

# 300 steps ≈ 6.8 epochs, 18 minutes at 3.66 s/step
iters: 300
batch_size: 4

max_seq_length: 1024

learning_rate: 1e-5

save_every: 50
adapter_path: /Volumes/LLM/adapters/reviewer-v2

steps_per_report: 10
steps_per_eval: 50
val_batches: 10

grad_checkpoint: true

mask_prompt: true

lora_parameters:
  rank: 16
  # Note: mlx-lm uses `scale`, not the `alpha` other frameworks use
  scale: 32.0
  dropout: 0.0

seed: 42
