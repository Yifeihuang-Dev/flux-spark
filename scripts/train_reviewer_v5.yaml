# Reviewer LoRA fine-tuning config — v5 (null-handling augmentation, 500 steps)
#
# Data reviewer_mlx_v5 adds 15 new seeds with null guards + 13 matching mutations,
# raising the null-bug share from 6% to 15% (34/219).
# Result: on the null-specific test set, recall 23.1% (3x v3's 7.7%) with zero
# false positives — but F1 on the main set is below v3, so v3 remains the default.

model: /Volumes/LLM/hf/MiniCPM5-2B-SFT-MLX-4bit

data: /Volumes/LLM/datasets/reviewer_mlx_v5
train: true
fine_tune_type: lora

num_layers: 16

iters: 500
batch_size: 4

max_seq_length: 1024

learning_rate: 1e-5

save_every: 50
adapter_path: /Volumes/LLM/adapters/reviewer-v5

steps_per_report: 10
steps_per_eval: 50
val_batches: 10

grad_checkpoint: true

mask_prompt: true

lora_parameters:
  rank: 16
  # Note: mlx-lm uses `scale`, not the `alpha` other frameworks use
  scale: 32.0
  dropout: 0.0

seed: 42
